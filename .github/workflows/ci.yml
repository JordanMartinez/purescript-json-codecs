name: CI

# Run CI when a PR is opened against the branch `master`
# and when one pushes a commit to `master`.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Run CI on all 3 latest OSes
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node toolchain
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"

      - name: Setup PS toolchain
        run: |
          npm i -g purescript@0.15.10 spago@1.0.5 purescript-psa purs-tidy

      - name: Cache PureScript dependencies
        uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('**/spago.yaml') }}
          path: |
            .spago
            output


      - name: Build the project
        run: |
          spago build -p json-codecs

      - name: Run tests
        run: |
          spago test -p json-codecs

      - name: Build the benchmarks
        run: |
          spago build -p json-codecs-benchmarks --purs-args 'bench/**/*.purs'

      - name: Check Formatting
        run: |
          purs-tidy check src test bench snapshots
